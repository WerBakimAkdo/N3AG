<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N3AG - Access Portal</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
* { box-sizing: border-box; }

html, body {
    width: 100%;
    min-height: 100svh;
}

body {
    margin: 0;
    padding: 0;
    min-height: 100svh;
    background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
}

.bg-grid {
    position: absolute;
    inset: -50%;
    background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    transform: perspective(600px) rotateX(60deg);
    animation: gridMove 20s linear infinite;
    z-index: 0;
    pointer-events: none;
}

@keyframes gridMove {
    from { background-position: 0 0; }
    to { background-position: 0 1000px; }
}

.container {
    text-align: center;
    position: relative;
    z-index: 2;
    padding: 20px;
}

.fade-in {
    opacity: 0;
    animation: fadeIn 1.8s ease forwards;
}

.delay-1 { animation-delay: 0.5s; }
.delay-2 { animation-delay: 1.4s; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

h1 {
    font-size: clamp(48px, 10vw, 80px);
    margin: 0;
    letter-spacing: -2px;
    background: linear-gradient(to right, #ffffff, #777777);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

p {
    color: #888;
    font-size: clamp(14px, 3vw, 18px);
    margin-top: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
}

.glow-btn {
    margin-top: 40px;
    padding: 15px 40px;
    font-size: 18px;
    background: transparent;
    color: #00d2ff;
    border: 2px solid #00d2ff;
    border-radius: 50px;
    cursor: pointer;
    transition: 0.4s ease;
    text-decoration: none;
    display: inline-block;
    box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
}

.glow-btn:hover {
    background: #00d2ff;
    color: #000;
    box-shadow: 0 0 40px rgba(0, 210, 255, 0.6);
    transform: scale(1.05);
}

.footer {
    position: absolute;
    bottom: 30px;
    display: flex;
    gap: 30px;
    z-index: 5;
    font-size: 14px;
}

.footer a {
    color: #555;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.3s ease, color 0.3s ease;
}

.footer a:hover {
    color: #00d2ff;
    transform: translateY(-3px);
}

.footer i {
    font-size: 18px;
}

@media (max-width: 600px) {
    .footer {
        flex-direction: column;
        gap: 10px;
        bottom: 20px;
        text-align: center;
    }
}
</style>
</head>

<body>

<div class="bg-grid"></div>

<div class="container">
    <h1 class="fade-in">N3AG</h1>
    <p class="fade-in delay-1">sürücüler tarayıcılar uygulamalar ve dahası</p>
    <a href="/login.html" class="glow-btn fade-in delay-2">Sisteme Giriş Yap</a>
</div>

<div class="footer fade-in delay-2">
    <a href="mailto:n3ag.services@gmail.com">
        <i class="fas fa-envelope"></i> n3ag.services@gmail.com
    </a>
    <a href="https://instagram.com/_n3ag_" target="_blank">
        <i class="fab fa-instagram"></i> @n3ag
    </a>
</div>

<script>
/* HARD FAIL SAFE – sayfa asla donmaz */
window.addEventListener("pageshow", () => {
    document.body.style.pointerEvents = "auto";
});
</script>

</body>
</html>
